openapi: 3.0.3
info:
  title: Cafe Sipariş Sistemi API
  version: 1.0.0
  description: >
    Bu API bir kafe sipariş sisteminin yönetilmesi için tasarlanmıştır.
    Kullanıcılar sisteme kayıt olabilir, giriş yapabilir, menüyü görüntüleyebilir
    ve sipariş oluşturabilir. Admin kullanıcılar menü ve siparişleri yönetebilir.

servers:
  - url: emptyForNow
    description: Production
  - url: emptyForNow
    description: Staging
  - url: emptyForNow
    description: Development

tags:
  - name: Auth
    description: Kullanıcı kimlik doğrulama işlemleri
  - name: Menu
    description: Menü yönetimi
  - name: Orders
    description: Sipariş işlemleri

security:
  - BearerAuth: []

paths:

  /auth/register:
    post:
      tags:
        - Auth
      summary: Kullanıcı kayıt
      description: Yeni bir kullanıcı oluşturmak için kullanılır. Kayıt işlemi sonrası kullanıcı giriş yapabilir.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            examples:
              example1:
                summary: Örnek kullanıcı kaydı
                value:
                  email: user@example.com
                  password: 123456
                  firstName: John
                  lastName: Doe
      responses:
        "201":
          description: Kullanıcı başarıyla oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: Geçersiz veri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Kullanıcı giriş
      description: Kayıtlı bir kullanıcı email ve şifresi ile giriş yapar. Başarılı girişte JWT token döner.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        "200":
          description: Giriş başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Hatalı email veya şifre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /menu:
    get:
      tags:
        - Menu
      summary: Menü listele
      description: Mevcut menüdeki tüm ürünleri listeler. Herkes erişebilir.
      operationId: listMenu
      parameters:
        - name: category
          in: query
          description: Ürün kategorisine göre filtreleme
          schema:
            type: string
          example: "coffee"
        - name: maxPrice
          in: query
          description: Belirli bir fiyattan daha ucuz ürünleri filtreleme
          schema:
            type: number
          example: 100
        - name: search
          in: query
          description: Ürün adında arama yapma
          schema:
            type: string
          example: "latte"
        - name: page
          in: query
          description: Sayfa numarası (sayfalama için)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Sayfa başına ürün sayısı (sayfalama için)
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: sort
          in: query
          description: Sıralama kriteri (price_asc, price_desc, name_asc, name_desc)
          schema:
            type: string
          example: "price_asc"
      responses:
        "200":
          description: Menü listelendi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'

    post:
      tags:
        - Menu
      summary: Menüye ürün ekle (Admin)
      description: Yeni bir ürün eklemek için kullanılır. Sadece admin kullanıcılar erişebilir.
      operationId: addMenuItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuInput'
      responses:
        "201":
          description: Ürün eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        "401":
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Admin yetkisi gerekli
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /menu/{urunId}:
    parameters:
      - name: urunId
        in: path
        required: true
        description: Menü ürününün ID değeri
        schema:
          type: string
        example: "menu123"

    put:
      tags:
        - Menu
      summary: Menü ürünü güncelle (Admin)
      description: Var olan bir ürünün bilgilerini güncellemek için kullanılır. Sadece admin kullanıcılar erişebilir.
      operationId: updateMenuItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuInput'
      responses:
        "200":
          description: Ürün güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        "404":
          description: Ürün bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Menu
      summary: Menü ürünü sil (Admin)
      description: Var olan bir ürünü menüden silmek için kullanılır. Sadece admin kullanıcılar erişebilir.
      operationId: deleteMenuItem
      responses:
        "204":
          description: Ürün silindi
        "404":
          description: Ürün bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders:
    post:
      tags:
        - Orders
      summary: Sipariş oluştur
      description: Kayıtlı bir kullanıcı yeni bir sipariş oluşturur. Sipariş oluşturulduktan sonra "pending" durumunda olur.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        "201":
          description: Sipariş oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

    get:
      tags:
        - Orders
      summary: Siparişleri listele (Admin)
      description: Tüm siparişleri listeler. Sadece admin kullanıcılar erişebilir. Sayfalama ve filtreleme seçenekleri mevcuttur.
      operationId: listOrders
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        "200":
          description: Siparişler listelendi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
        example: "order456"

    put:
      tags:
        - Orders
      summary: Sipariş güncelle (Admin)
      description: Var olan bir siparişin durumunu güncellemek için kullanılır. Sadece admin kullanıcılar erişebilir.
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        "200":
          description: Sipariş güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

    delete:
      tags:
        - Orders
      summary: Sipariş sil (Admin)
      description: Var olan bir siparişi silmek için kullanılır. Sadece admin kullanıcılar erişebilir.
      operationId: deleteOrder
      responses:
        "204":
          description: Sipariş silindi

components:

  securitySchemes:
    BearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: JWT token kullanılır. "Bearer <token>"

  schemas:

    User:
      type: object
      properties:
        id:
          type: string
          example: "user123"
        email:
          type: string
          example: "user@email.com"
        role:
          type: string
          example: "user"

    RegisterInput:
      type: object
      properties:
        email:
          type: string
          example: "user@email.com"
        password:
          type: string
          example: "123456"
      required:
        - email
        - password

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "jwt-token-example"

    MenuItem:
      type: object
      properties:
        id:
          type: string
          example: "menu123"
        name:
          type: string
          example: "Latte"
        price:
          type: number
          example: 75
        description:
          type: string
          example: "Sıcak sütlü kahve"

    MenuInput:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        description:
          type: string
      required:
        - name
        - price

    Order:
      type: object
      properties:
        id:
          type: string
          example: "order456"
        userId:
          type: string
          example: "user123"
        items:
          type: array
          items:
            type: string
        status:
          type: string
          example: "pending"
        createdAt:
          type: string
          format: date-time

    OrderInput:
      type: object
      properties:
        items:
          type: array
          items:
            type: string
      required:
        - items

    Error:
      type: object
      properties:
        message:
          type: string
          example: "Bir hata oluştu"